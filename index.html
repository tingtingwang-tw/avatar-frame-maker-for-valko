<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211916">
  <meta name="description" content="敖尹應援頭像框">
  <title>敖尹應援頭像框</title>
  <link rel="icon" type="image/png" href="assets/site-icon.png?v=20260730-4">
  <link rel="apple-touch-icon" href="assets/site-icon.png?v=20260730-4">
  <link rel="stylesheet" href="styles.css?v=20260920-10">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-leading">
        <div id="brandLabel" class="brand" aria-label="#BRINGVALKOBACK #VALKOISLOVED">
          <img class="brand-icon" src="assets/site-icon.png?v=20260730-4" alt="" aria-hidden="true">
          <span class="brand-lines">
            <span>#BRINGVALKOBACK</span>
            <span>#VALKOISLOVED</span>
          </span>
        </div>
        <button id="homeButton" class="home-button" type="button" aria-label="回首頁" title="回首頁" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 10 8-6 8 6"></path>
            <path d="M6.5 9.5V20h11V9.5"></path>
            <path d="M10 20v-6h4v6"></path>
          </svg>
        </button>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-button is-active" type="button" data-lang="zh">中文</button>
        <button class="lang-button" type="button" data-lang="en">EN</button>
      </div>
    </header>

    <section id="uploadScreen" class="screen upload-screen">
      <div class="home-showcase-row">
        <div class="home-poster-visual" aria-hidden="true">
          <div id="homeFrameStack" class="home-frame-stack">
            <div class="home-stack-card home-stack-back">
              <img id="homeStackBack" src="assets/frame-wolf-howl-valkoisloved.png?v=20260804-1" alt="">
            </div>
            <div class="home-stack-card home-stack-middle">
              <img id="homeStackMiddle" src="assets/frame-lily-bringvalkoback.png?v=20260920-2" alt="">
            </div>
            <div class="home-stack-card home-stack-front">
              <img id="homeStackFront" src="assets/frame-basic-bringvalkoback.png?v=20260801-3" alt="">
            </div>
          </div>
        </div>
        <blockquote class="campaign-quote">
          <p><span data-i18n="campaignBefore">敖尹的加入，也是</span><span class="campaign-game-title" data-i18n="gameTitle">《戀與深空》</span><span data-i18n="campaignAfter">長期內容規劃中的一環。</span></p>
          <cite><span class="campaign-game-title" data-i18n="gameTitle">《戀與深空》</span><span class="campaign-team" data-i18n="campaignTeam">製作組</span><span data-i18n="campaignDate">，2026.06.28</span></cite>
        </blockquote>
      </div>
      <div class="home-poster-copy">
        <h1>
          <span data-i18n="titleLine1">敖尹應援</span><span data-i18n="titleLine2">頭像框</span>
        </h1>
        <p class="intro">
          <span data-i18n="introLine1">加上頭像框，用專屬於你的頭貼</span>
          <span data-i18n="introLine2">為敖尹應援吧！</span>
        </p>
      </div>
      <button id="uploadButton" class="primary-button" type="button" data-i18n="start">開始製作</button>
      <p class="privacy-note">
        <span class="privacy-dot" aria-hidden="true"></span>
        <span data-i18n="privacy">照片只會在您的裝置上處理與保存，不會上傳至任何伺服器。</span>
      </p>
    </section>

    <section id="editorScreen" class="screen editor-screen" hidden>
      <input id="photoInput" type="file" accept="image/*" hidden>
      <div class="preview-card">
        <div id="canvasWrap" class="canvas-wrap">
          <canvas id="previewCanvas" width="2048" height="2048" aria-label="Avatar preview"></canvas>
          <button id="canvasUploadButton" class="canvas-upload-button" type="button" data-i18n="uploadPhoto">上傳照片</button>
          <span id="gestureHint" class="gesture-hint" data-i18n="dragHint" hidden>拖曳移動 · 雙指縮放</span>
        </div>
      </div>

      <div class="controls is-collapsed">
        <div class="zoom-row">
          <span class="zoom-label" data-i18n="zoom">縮放</span>
          <input id="zoomSlider" type="range" min="0.2" max="3" step="0.01" value="1" aria-label="Zoom" disabled>
          <span id="zoomValue" class="zoom-value">100%</span>
        </div>
      </div>

      <div class="frame-panel">
        <h3 class="frame-panel-title" data-i18n="frameTitle">選擇頭像框</h3>
        <div class="frame-meta">
          <span id="frameName" class="frame-name">基礎 · #BRINGVALKOBACK</span>
          <span id="frameIndex" class="frame-index">1 / 6</span>
        </div>
        <div id="frameList" class="frame-list" aria-label="Avatar frames"></div>
        <button id="blankSaveButton" class="blank-save-button" type="button">
          <span data-i18n="blankSave">不使用照片？直接儲存留白版本</span>
          <span aria-hidden="true">→</span>
        </button>
        <div class="mode-actions">
          <button id="saveButton" class="primary-button" type="button" data-i18n="save" disabled>儲存圖片</button>
          <button id="restartButton" class="restart-button" type="button" data-i18n="restart" hidden>重新製作</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-lines">
        <div>
          <span data-i18n="createdBy">本網站由</span>
          <a href="https://www.threads.com/@tingtingwang_tw" target="_blank" rel="noopener noreferrer">Ting Ting Wang</a>
          <span data-i18n="createdSuffix">創建</span>
          <span aria-hidden="true"> · </span>
          <span data-i18n="aiCredit">頭像框圖案由 Codex 生成</span>
        </div>
        <div class="footer-disclaimer" data-i18n="disclaimer">此為玩家自製之應援工具，與《戀與深空》官方無直接關聯</div>
      </div>
    </footer>
  </main>

  <div id="exportSheet" class="sheet-backdrop" role="dialog" aria-modal="true" aria-labelledby="exportTitle" hidden>
    <div class="sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h3 id="exportTitle" data-i18n="exportTitle">選擇圖片尺寸</h3>
      <p id="exportCopy" class="sheet-copy" data-i18n="exportCopy">PNG 格式，適合保存與分享。</p>
      <div class="size-options">
        <button class="size-button" type="button" data-export-size="2048">
          <span>
            <strong>2048 × 2048</strong>
            <small data-i18n="highQuality">高畫質</small>
          </span>
          <span>PNG</span>
        </button>
        <button class="size-button" type="button" data-export-size="1080">
          <span>
            <strong>1080 × 1080</strong>
            <small data-i18n="smallFile">較小檔案</small>
          </span>
          <span>PNG</span>
        </button>
      </div>
      <button id="closeSheetButton" class="ghost-button sheet-close" type="button" data-i18n="cancel">取消</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="successOverlay" class="success-overlay" role="status" aria-live="polite" hidden>
    <div class="success-card">
      <span class="success-check" aria-hidden="true"></span>
      <strong data-i18n="saveSuccess">保存成功</strong>
    </div>
  </div>

  <script src="app.js?v=20260920-7"></script>
</body>
</html>
